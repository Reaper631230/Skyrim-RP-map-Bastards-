<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Карта Скайрима</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    body { margin: 0; font-family: Georgia, serif; background: #1a1a2e; }
    #map { height: 100vh; width: 100%; background: #1a1a2e; }

    /* ============================================================
       МАРКЕР
       ============================================================ */
    .marker-wrap {
      position: relative;
      display: block;
      width: 40px;
      height: 40px;
      pointer-events: none;
      transform-origin: center bottom;
      transition: transform 0.15s;
    }

    .marker-wrap .city-icon {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 32px;
      cursor: pointer;
      pointer-events: auto;
      filter: drop-shadow(0 0 3px #000) drop-shadow(0 0 5px gold);
      transform-origin: center bottom;
    }
    .marker-wrap .city-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }
    .marker-wrap .city-icon:hover {
      transform: translateX(-50%) scale(1.4);
    }

    .marker-wrap .city-label {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 2px;
      color: #ffe9b0;
      font-size: 12px;
      font-weight: bold;
      text-shadow:
        -1px -1px 0 #000, 1px -1px 0 #000,
        -1px 1px 0 #000, 1px 1px 0 #000,
        0 0 5px #000;
      white-space: nowrap;
      pointer-events: none;
      text-align: center;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .marker-wrap:hover .city-label,
    .marker-wrap.pinned .city-label,
    .marker-wrap.zoom-visible .city-label {
      opacity: 1;
    }

    .marker-wrap.highlight .city-icon {
      animation: pulse 1s ease-in-out 3;
    }
    @keyframes pulse {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(2); }
    }

    /* Попап */
    .leaflet-popup-content-wrapper {
      background: linear-gradient(180deg, #f4e4bc 0%, #d9c398 100%);
      color: #2c1810;
      border: 2px solid #8b6914;
      border-radius: 4px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }
    .leaflet-popup-tip { background: #d9c398; border: 2px solid #8b6914; }
    .leaflet-popup-content { margin: 12px 16px; }
    .leaflet-popup-content h3 {
      margin: 0 0 6px;
      color: #6b3410;
      font-size: 16px;
      border-bottom: 1px solid #8b6914;
      padding-bottom: 4px;
    }
    .leaflet-popup-content p { margin: 4px 0; font-size: 13px; }
    .leaflet-popup-content .type {
      display: inline-block;
      background: #6b3410;
      color: #f4e4bc;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 10px;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    /* ============================================================
       ЛЕГЕНДА
       ============================================================ */
    .legend {
      background: rgba(20, 12, 6, 0.9);
      color: #f4e4bc;
      padding: 10px 14px;
      border: 2px solid #8b6914;
      border-radius: 6px;
      font-family: Georgia, serif;
      font-size: 12px;
      line-height: 1.5;
    }
    .legend h4 {
      margin: 0 0 6px;
      color: #ffd700;
      font-size: 13px;
      border-bottom: 1px solid #8b6914;
      padding-bottom: 3px;
    }
    .legend .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0;
    }
    .legend .legend-row img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      flex-shrink: 0;
    }

    /* ============================================================
       ЕДИНЫЙ ВИДЖЕТ
       ============================================================ */
    .sidebar-widget {
      background: rgba(20, 12, 6, 0.95);
      border: 2px solid #8b6914;
      border-radius: 6px;
      width: 300px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      font-family: Georgia, serif;
      overflow: visible;
    }
    .sidebar-widget .search-section {
      padding: 10px;
      position: relative;
      border-bottom: 2px solid #8b6914;
    }
    .sidebar-widget .search-section input {
      width: 100%;
      box-sizing: border-box;
      background: #f4e4bc;
      border: 1px solid #6b3410;
      border-radius: 4px;
      padding: 8px 28px 8px 10px;
      font-family: Georgia, serif;
      font-size: 14px;
      color: #2c1810;
      outline: none;
    }
    .sidebar-widget .search-section input:focus {
      border-color: #ffd700;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
    }
    .sidebar-widget .search-section input::placeholder {
      color: #8b6914;
      font-style: italic;
    }
    .sidebar-widget .search-hint {
      font-size: 10px;
      color: #b8860b;
      font-style: italic;
      margin-top: 5px;
      text-align: center;
      opacity: 0.8;
    }
    .sidebar-widget .search-clear {
      position: absolute;
      right: 18px;
      top: 18px;
      background: none;
      border: none;
      color: #6b3410;
      font-size: 16px;
      cursor: pointer;
      display: none;
      padding: 0;
      line-height: 1;
    }
    .sidebar-widget .search-clear.visible { display: block; }

    .sidebar-widget .suggestions {
      position: absolute;
      top: 100%;
      left: 10px;
      right: 10px;
      margin-top: 4px;
      background: #f4e4bc;
      border: 2px solid #8b6914;
      border-radius: 4px;
      max-height: 340px;
      overflow-y: auto;
      display: none;
      z-index: 1000;
    }
    .sidebar-widget .suggestions.open { display: block; }
    .sidebar-widget .suggestions div {
      padding: 8px 12px;
      cursor: pointer;
      color: #2c1810;
      font-size: 13px;
      border-bottom: 1px solid #d9c398;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar-widget .suggestions div:last-child { border-bottom: none; }
    .sidebar-widget .suggestions div:hover,
    .sidebar-widget .suggestions div.active {
      background: #8b6914;
      color: #fff;
    }
    .sidebar-widget .suggestions div .ico {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sidebar-widget .suggestions div .ico img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .sidebar-widget .suggestions div .row-text {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
    }
    .sidebar-widget .suggestions div .row-name { font-weight: bold; }
    .sidebar-widget .suggestions div .snippet {
      font-size: 11px;
      opacity: 0.8;
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      margin-top: 2px;
    }
    .sidebar-widget .suggestions div:hover .snippet,
    .sidebar-widget .suggestions div.active .snippet {
      color: #ffe9b0;
    }
    .sidebar-widget .suggestions div .type-tag {
      margin-left: auto;
      font-size: 10px;
      opacity: 0.7;
      font-style: italic;
      flex-shrink: 0;
    }
    .sidebar-widget .suggestions div mark {
      background: #ffd700;
      color: #2c1810;
      padding: 0 2px;
      border-radius: 2px;
    }
    .sidebar-widget .suggestions .no-results {
      padding: 10px 12px;
      color: #6b3410;
      font-style: italic;
      cursor: default;
    }
    .sidebar-widget .suggestions .no-results:hover {
      background: #f4e4bc;
      color: #6b3410;
    }

    .sidebar-widget .filter-section {
      padding: 10px 14px 12px;
      color: #f4e4bc;
      font-size: 13px;
    }
    .sidebar-widget .filter-section h4 {
      margin: 0 0 8px;
      color: #ffd700;
      font-size: 13px;
      text-align: center;
      letter-spacing: 1px;
    }
    .sidebar-widget .filter-section label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 4px;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.15s;
      user-select: none;
    }
    .sidebar-widget .filter-section label:hover {
      background: rgba(139, 105, 20, 0.3);
    }
    .sidebar-widget .filter-section input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #b8860b;
      cursor: pointer;
      flex-shrink: 0;
    }
    .sidebar-widget .filter-section .icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .sidebar-widget .filter-section .icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .sidebar-widget .filter-section .count {
      margin-left: auto;
      font-size: 11px;
      opacity: 0.6;
      font-style: italic;
    }
    .sidebar-widget .filter-section .filter-buttons {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #8b6914;
    }
    .sidebar-widget .filter-section .filter-buttons button {
      flex: 1;
      background: #6b3410;
      color: #f4e4bc;
      border: 1px solid #8b6914;
      border-radius: 4px;
      padding: 5px 6px;
      font-family: Georgia, serif;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .sidebar-widget .filter-section .filter-buttons button:hover {
      background: #8b6914;
      color: #ffd700;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ============================================================
    // 1. РАЗМЕРЫ КАРТИНКИ
    // ============================================================
    var W = 8192;
    var H = 8192;

    var OLD_W = 1996;
    var OLD_H = 1556;

    // ============================================================
    // 2. ИНИЦИАЛИЗАЦИЯ КАРТЫ
    // ============================================================
    var bounds = [[0, 0], [H, W]];

    var map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -4,
      maxZoom: 4,
      zoomSnap: 0.25,
      zoomDelta: 0.5,
      wheelPxPerZoomLevel: 120,
      attributionControl: false,
      zoomControl: false,
      maxBounds: bounds,
      maxBoundsViscosity: 1.0
    });

    // Основная карта
    L.imageOverlay('skyrim.png', bounds).addTo(map);

    // ============================================================
    // 3. СЛОЙ ГРАНИЦ ХОЛДОВ (holds.png)
    // Прозрачный PNG с границами, нарисованный в Photopea.
    // Лежит поверх карты, можно включать/выключать.
    // ============================================================
    var holdsLayer = L.imageOverlay('holds.png', bounds, {
      opacity: 0.9,
      interactive: false,
      zIndex: 500
    });
    holdsLayer.addTo(map);   // показан по умолчанию

    map.fitBounds(bounds);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // ============================================================
    // 4. ЕДИНЫЙ СПИСОК ТОЧЕК
    // ============================================================
    var cities = [
      // ================= ГОРОДА =================
      { x: 1009, y: 850,  icon: 'icons/Whiterun.svg',    name: 'Вайтран',    type: 'Город',
        desc: 'Центр Скайрима. Дом ярла Балгруфа.',
        keys: ['дом', 'жилье', 'центр', 'балгруф', 'соратники', 'пшеница', 'равнина'] },

      { x: 1515, y: 674,  icon: 'icons/Windhelm.svg',    name: 'Виндхельм',  type: 'Город',
        desc: 'Древний город на востоке. Оплот Братьев Бури.',
        keys: ['дом', 'жилье', 'восток', 'буря', 'ульфрик', 'древний', 'ярл'] },

      { x: 96,   y: 810,  icon: 'icons/Markarth.svg',    name: 'Маркарт',    type: 'Город',
        desc: 'Город в горах Друадах.',
        keys: ['дом', 'жилье', 'горы', 'друадах', 'шахта', 'серебро', 'сильверхенд'] },

      { x: 1692, y: 1272, icon: 'icons/Riften.svg',      name: 'Рифтен',     type: 'Город',
        desc: 'Осенний город у реки. Вотчина Мавен.',
        keys: ['дом', 'жилье', 'река', 'мавен', 'осень', 'воры', 'гильдия воров'] },

      { x: 784,  y: 1239, icon: 'icons/Falkreath.svg',   name: 'Фолкрит',    type: 'Город',
        desc: 'Южный город, вотчина ярла Сиддгейра.',
        keys: ['дом', 'жилье', 'юг', 'сиддгейр', 'ярл', 'лес'] },

      { x: 737,  y: 538,  icon: 'icons/Morthal.svg',     name: 'Морфал',     type: 'Город',
        desc: 'Родина ярла Идгрод Чёрный Ручей.',
        keys: ['дом', 'жилье', 'идгрод', 'ручей', 'ярл'] },

      { x: 631,  y: 355,  icon: 'icons/Solitude.svg',    name: 'Солитьюд',   type: 'Город',
        desc: 'Столица Скайрима, резиденция Верховного короля.',
        keys: ['дом', 'жилье', 'столица', 'король', 'элисиф', 'империя', 'легион'] },

      { x: 1066, y: 361,  icon: 'icons/Dawnstar.svg',    name: 'Данстар',    type: 'Город',
        desc: 'Порт на северном побережье, шахтёрский город.',
        keys: ['дом', 'жилье', 'порт', 'север', 'шахта', 'море', 'серебро'] },

      { x: 1372, y: 369,  icon: 'icons/Winterhold.svg',  name: 'Винтерхолд', type: 'Город',
        desc: 'Северо-восточный город, дом Коллегии магов.',
        keys: ['дом', 'жилье', 'магия', 'коллегия', 'маги', 'север', 'восток'] },

      // ================= ШАХТЫ =================
      { x: 151,  y: 856,  icon: 'icons/mine.svg',         name: 'Левая рука',      type: 'Шахта',
        desc: 'Железно-угольная шахта.',
        keys: ['руда', 'железо', 'уголь'] },

      { x: 357,  y: 818,  icon: 'icons/mine.svg',         name: 'Логово Сольюнда', type: 'Шахта',
        desc: 'Шахта лунного камня.',
        keys: ['руда', 'лунный камень', 'копать', 'добыча', 'редкость'] },

      { x: 219,  y: 777,  icon: 'icons/mine.svg',         name: 'Колскеггр',       type: 'Шахта',
        desc: 'Золотая шахта.',
        keys: ['руда', 'золото'] },

      { x: 538,  y: 1021, icon: 'icons/mine.svg',         name: 'Желчная шахта',   type: 'Шахта',
        desc: 'Орихалковая шахта.',
        keys: ['руда', 'орихалк'] },

      { x: 1529, y: 779,  icon: 'icons/mine.svg',         name: 'Горячий Пар',     type: 'Шахта',
        desc: 'Малахитово-угольная шахта.',
        keys: ['руда', 'малахит'] },

      { x: 1466, y: 996,  icon: 'icons/mine.svg',         name: 'Черный брод',     type: 'Шахта',
        desc: 'Корундовая шахта.',
        keys: ['руда', 'корунд'] },

      { x: 1575, y: 1047, icon: 'icons/mine.svg',         name: 'Северный ветер',  type: 'Шахта',
        desc: 'Железно-угольная шахта.',
        keys: ['руда', 'железо', 'уголь'] },

      { x: 1628, y: 1132, icon: 'icons/mine.svg',         name: 'Камень Шора',     type: 'Шахта',
        desc: 'Эбонитово-угольная шахта.',
        keys: ['руда', 'эбонит', 'уголь'] },

      { x: 1813, y: 1247, icon: 'icons/mine.svg',         name: 'Потерянный шанс', type: 'Шахта',
        desc: 'Золотая шахта.',
        keys: ['руда', 'золото', 'богатство', 'копать', 'добыча'] },

      { x: 889,  y: 550,  icon: 'icons/mine.svg',         name: 'Каменные холмы',  type: 'Шахта',
        desc: 'Железная шахта.',
        keys: ['руда', 'железо'] },

      { x: 1456, y: 490,  icon: 'icons/mine.svg',         name: 'Свистящая шахта', type: 'Шахта',
        desc: 'Железная шахта.',
        keys: ['руда', 'железо'] },

      // ================= СПАВН ЖИВОТНЫХ =================
      { x: 967,  y: 367,  icon: 'icons/animal.svg',       name: 'Белые волки', type: 'Спавн животных',
        desc: 'Спавн белых волков.',
        keys: ['шкура белого волка', 'низкосортный жир', 'волчатина'] },

      { x: 1221, y: 402,  icon: 'icons/animal.svg',       name: 'Белые волки', type: 'Спавн животных',
        desc: 'Спавн белых волков.',
        keys: ['шкура белого волка', 'низкосортный жир', 'волчатина'] },

      { x: 421,  y: 349,  icon: 'icons/animal.svg',       name: 'Малые пауки', type: 'Спавн животных',
        desc: 'Спавн малых пауков.',
        keys: [] },

      { x: 337,  y: 434,  icon: 'icons/animal.svg',       name: 'Малые пауки', type: 'Спавн животных',
        desc: 'Спавн малых пауков.',
        keys: [] },

      { x: 418,  y: 320,  icon: 'icons/animal.svg',       name: 'Злокрысы',    type: 'Спавн животных',
        desc: 'Спавн злокрыс.',
        keys: [] },

      { x: 509,  y: 433,  icon: 'icons/animal.svg',       name: 'Волки',       type: 'Спавн животных',
        desc: 'Спавн волков.',
        keys: ['шкура волка', 'низкосортный жир', 'волчатина'] },

      { x: 440,  y: 788,  icon: 'icons/animal.svg',       name: 'Волки',       type: 'Спавн животных',
        desc: 'Спавн волков.',
        keys: ['шкура волка', 'низкосортный жир', 'волчатина'] },

      { x: 705,  y: 471,  icon: 'icons/animal.svg',       name: 'Волки',       type: 'Спавн животных',
        desc: 'Спавн волков.',
        keys: ['шкура волка', 'низкосортный жир', 'волчатина'] },
    ];

    // ============================================================
    // 5. ПЕРЕСЧЁТ КООРДИНАТ МЕТОК
    // ============================================================
    var SCALE_X = W / OLD_W;
    var SCALE_Y = H / OLD_H;

    cities.forEach(function(c) {
      c.x = Math.round(c.x * SCALE_X);
      c.y = Math.round(c.y * SCALE_Y);
    });

    // ============================================================
    // 6. ИКОНКА ПО УМОЛЧАНИЮ
    // ============================================================
    var DEFAULT_ICON = 'icons/castle.svg';

    // ============================================================
    // 7. ИКОНКИ КАТЕГОРИЙ
    // ============================================================
    var categoryIcons = {
      'Город': 'icons/castle.svg',
      'Шахта': 'icons/mine.svg',
      'Спавн животных': 'icons/animal.svg'
    };

    // ============================================================
    // 8. СОЗДАНИЕ МАРКЕРОВ
    // ============================================================
    var cityMarkers = {};
    var typeGroups = {};

    var allTypes = [];
    cities.forEach(function(c) {
      if (allTypes.indexOf(c.type) === -1) allTypes.push(c.type);
    });

    allTypes.forEach(function(type) {
      typeGroups[type] = L.layerGroup().addTo(map);
    });

    cities.forEach(function(city) {
      var y = H - city.y;
      var iconPath = city.icon || DEFAULT_ICON;

      var markerIcon = L.divIcon({
        className: '',
        html:
          '<div class="marker-wrap" data-name="' + city.name + '">' +
            '<div class="city-icon">' +
              '<img src="' + iconPath + '" alt="" draggable="false" />' +
            '</div>' +
            '<div class="city-label">' + city.name + '</div>' +
          '</div>',
        iconSize: [40, 40],
        iconAnchor: [20, 40]
      });

      var marker = L.marker([y, city.x], { icon: markerIcon })
        .bindPopup(
          '<span class="type">' + city.type + '</span>' +
          '<h3>' + city.name + '</h3>' +
          '<p>' + city.desc + '</p>',
          {
            offset: [0, -46],
            autoPan: true,
            autoPanPadding: [40, 40],
            closeButton: true,
            maxWidth: 280,
            closeOnClick: false
          }
        );

      marker.addTo(typeGroups[city.type]);
      cityMarkers[city.name] = marker;
    });

    // ============================================================
    // 9. ЛЕГЕНДА
    // ============================================================
    var legend = L.control({ position: 'topright' });
    legend.onAdd = function() {
      var div = L.DomUtil.create('div', 'legend');

      var rows = '<h4>⚔ Скайрим</h4>';

      allTypes.forEach(function(type) {
        var sample = cities.find(function(c) { return c.type === type; });
        var iconPath = categoryIcons[type]
                    || (sample && sample.icon)
                    || DEFAULT_ICON;

        rows +=
          '<div class="legend-row">' +
            '<img src="' + iconPath + '" alt="" />' +
            '<span>' + type + '</span>' +
          '</div>';
      });

      div.innerHTML = rows;
      L.DomEvent.disableClickPropagation(div);
      return div;
    };
    legend.addTo(map);

    // ============================================================
    // 10. ЕДИНЫЙ ВИДЖЕТ: ПОИСК + ФИЛЬТР
    // ============================================================
    var SidebarControl = L.Control.extend({
      options: { position: 'topleft' },
      onAdd: function() {
        var container = L.DomUtil.create('div', 'sidebar-widget');

        var html = '';

        html +=
          '<div class="search-section">' +
            '<input type="text" id="search-input" placeholder="🔍 Поиск..." autocomplete="off"/>' +
            '<button class="search-clear" id="search-clear" title="Очистить">✕</button>' +
            '<div class="search-hint">имя · тип · описание</div>' +
            '<div class="suggestions" id="suggestions"></div>' +
          '</div>';

        html += '<div class="filter-section"><h4>⚙ Фильтры</h4>';
        allTypes.forEach(function(type) {
          var count = cities.filter(function(c) { return c.type === type; }).length;
          var sample = cities.find(function(c) { return c.type === type; });
          var iconPath = categoryIcons[type]
                      || (sample && sample.icon)
                      || DEFAULT_ICON;
          html +=
            '<label>' +
              '<input type="checkbox" data-type="' + type + '" checked />' +
              '<span class="icon"><img src="' + iconPath + '" alt="" /></span>' +
              '<span>' + type + '</span>' +
              '<span class="count">' + count + '</span>' +
            '</label>';
        });

        // Отдельный переключатель для границ холдов
        html +=
          '<label style="border-top: 1px solid #8b6914; margin-top: 6px; padding-top: 8px;">' +
            '<input type="checkbox" id="toggle-holds" checked />' +
            '<span class="icon">🗺️</span>' +
            '<span>Границы холдов</span>' +
          '</label>';

        html +=
          '<div class="filter-buttons">' +
            '<button id="filter-all">Все</button>' +
            '<button id="filter-none">Ничего</button>' +
          '</div>';
        html += '</div>';

        container.innerHTML = html;

        L.DomEvent.disableClickPropagation(container);
        L.DomEvent.disableScrollPropagation(container);

        setTimeout(function() {
          var input = document.getElementById('search-input');
          var suggestBox = document.getElementById('suggestions');
          var clearBtn = document.getElementById('search-clear');
          var activeIndex = -1;

          // --- Фильтры категорий ---
          container.querySelectorAll('.filter-section input[type="checkbox"][data-type]').forEach(function(cb) {
            cb.addEventListener('change', function() {
              var type = cb.getAttribute('data-type');
              var group = typeGroups[type];
              if (!group) return;
              if (cb.checked) group.addTo(map);
              else map.removeLayer(group);
            });
          });

          // --- Переключатель границ холдов ---
          document.getElementById('toggle-holds').addEventListener('change', function() {
            if (this.checked) holdsLayer.addTo(map);
            else map.removeLayer(holdsLayer);
          });

          // --- Кнопки Все / Ничего ---
          document.getElementById('filter-all').addEventListener('click', function() {
            // Категории
            container.querySelectorAll('.filter-section input[type="checkbox"][data-type]').forEach(function(cb) {
              cb.checked = true;
              cb.dispatchEvent(new Event('change'));
            });
            // Границы холдов тоже включаем
            var holdsCb = document.getElementById('toggle-holds');
            holdsCb.checked = true;
            holdsCb.dispatchEvent(new Event('change'));
          });

          document.getElementById('filter-none').addEventListener('click', function() {
            // Категории выключаем
            container.querySelectorAll('.filter-section input[type="checkbox"][data-type]').forEach(function(cb) {
              cb.checked = false;
              cb.dispatchEvent(new Event('change'));
            });
            // Границы холдов тоже выключаем
            var holdsCb = document.getElementById('toggle-holds');
            holdsCb.checked = false;
            holdsCb.dispatchEvent(new Event('change'));
          });

          // --- Поиск ---
          function filterCities(query) {
            query = query.trim().toLowerCase();
            if (!query) return [];

            var visibleTypes = [];
            container.querySelectorAll('.filter-section input[type="checkbox"][data-type]').forEach(function(cb) {
              if (cb.checked) visibleTypes.push(cb.getAttribute('data-type'));
            });

            var words = query.split(/\s+/);

            var results = cities.filter(function(c) {
              if (visibleTypes.indexOf(c.type) === -1) return false;

              var keys = (c.keys || []).join(' ');
              var haystack = (c.name + ' ' + c.type + ' ' + c.desc + ' ' + keys).toLowerCase();

              return words.every(function(w) {
                return haystack.indexOf(w) !== -1;
              });
            });

            results.sort(function(a, b) {
              var aName = a.name.toLowerCase().indexOf(query) !== -1 ? 0 : 1;
              var bName = b.name.toLowerCase().indexOf(query) !== -1 ? 0 : 1;
              if (aName !== bName) return aName - bName;
              return a.name.localeCompare(b.name);
            });

            return results;
          }

          function highlightMatch(text, query) {
            if (!query) return text;
            var lower = text.toLowerCase();
            var pos = lower.indexOf(query);
            if (pos === -1) return text;
            return text.slice(0, pos) +
                   '<mark>' + text.slice(pos, pos + query.length) + '</mark>' +
                   text.slice(pos + query.length);
          }

          function renderSuggestions(query) {
            var results = filterCities(query);
            suggestBox.innerHTML = '';
            activeIndex = -1;

            if (!query.trim()) {
              suggestBox.classList.remove('open');
              return;
            }

            if (results.length === 0) {
              suggestBox.innerHTML = '<div class="no-results">Ничего не найдено</div>';
              suggestBox.classList.add('open');
              return;
            }

            var q = query.trim().toLowerCase();

            results.forEach(function(city) {
              var row = document.createElement('div');

              var inName = city.name.toLowerCase().indexOf(q) !== -1;
              var snippet = '';
              if (!inName) {
                snippet = '<span class="snippet">' + city.desc + '</span>';
              }

              var iconPath = city.icon || DEFAULT_ICON;

              row.innerHTML =
                '<span class="ico">' +
                  '<img src="' + iconPath + '" alt="" />' +
                '</span>' +
                '<span class="row-text">' +
                  '<span class="row-name">' + highlightMatch(city.name, q) + '</span>' +
                  (snippet ? snippet : '') +
                '</span>' +
                '<span class="type-tag">' + city.type + '</span>';

              row.addEventListener('click', function() {
                goToCity(city.name);
              });
              suggestBox.appendChild(row);
            });
            suggestBox.classList.add('open');
          }

          function goToCity(name) {
            var marker = cityMarkers[name];
            var city = cities.find(function(c) { return c.name === name; });
            if (!marker || !city) return;

            var y = H - city.y;
            map.flyTo([y, city.x], 2, { duration: 1.2 });

            setTimeout(function() {
              marker.openPopup();
              highlightMarker(city.name);
            }, 1300);

            suggestBox.classList.remove('open');
            input.value = name;
            clearBtn.classList.add('visible');
          }

          function highlightMarker(name) {
            var el = document.querySelector('.marker-wrap[data-name="' + name + '"]');
            if (!el) return;
            el.classList.add('highlight');
            setTimeout(function() {
              el.classList.remove('highlight');
            }, 3000);
          }

          input.addEventListener('input', function() {
            renderSuggestions(input.value);
            clearBtn.classList.toggle('visible', input.value.length > 0);
          });

          input.addEventListener('focus', function() {
            if (input.value.trim()) renderSuggestions(input.value);
          });

          input.addEventListener('keydown', function(e) {
            var rows = suggestBox.querySelectorAll('div:not(.no-results)');

            if (e.key === 'ArrowDown') {
              e.preventDefault();
              if (!rows.length) return;
              activeIndex = Math.min(activeIndex + 1, rows.length - 1);
              updateActive(rows);
            } else if (e.key === 'ArrowUp') {
              e.preventDefault();
              if (!rows.length) return;
              activeIndex = Math.max(activeIndex - 1, 0);
              updateActive(rows);
            } else if (e.key === 'Enter') {
              e.preventDefault();
              var target;
              if (activeIndex >= 0 && rows[activeIndex]) {
                target = rows[activeIndex].querySelector('.row-name').textContent;
              } else {
                var first = filterCities(input.value)[0];
                target = first ? first.name : null;
              }
              if (target) goToCity(target);
            } else if (e.key === 'Escape') {
              suggestBox.classList.remove('open');
              input.blur();
            }
          });

          function updateActive(rows) {
            rows.forEach(function(r, i) {
              r.classList.toggle('active', i === activeIndex);
            });
            if (rows[activeIndex]) {
              rows[activeIndex].scrollIntoView({ block: 'nearest' });
            }
          }

          clearBtn.addEventListener('click', function() {
            input.value = '';
            input.focus();
            suggestBox.classList.remove('open');
            clearBtn.classList.remove('visible');
          });

          document.addEventListener('click', function(e) {
            if (!container.contains(e.target)) {
              suggestBox.classList.remove('open');
            }
          });
        }, 0);

        return container;
      }
    });
    map.addControl(new SidebarControl());

    // ============================================================
    // 11. МАСШТАБИРОВАНИЕ МАРКЕРОВ ПРИ ЗУМЕ
    // ============================================================
    function scaleMarkers() {
      var zoom = map.getZoom();
      var scale = Math.max(0.7, Math.min(2.2, 1 + (zoom + 1) * 0.22));

      document.querySelectorAll('.marker-wrap').forEach(function(el) {
        el.style.transform = 'scale(' + scale + ')';
      });
    }

    map.on('zoomend', scaleMarkers);
    map.on('zoom', scaleMarkers);

    // ============================================================
    // 12. ПОДПИСИ ВСЕГДА ВИДНЫ ПРИ СИЛЬНОМ ПРИБЛИЖЕНИИ
    // ============================================================
    function updateLabelsVisibility() {
      var z = map.getZoom();
      document.querySelectorAll('.marker-wrap').forEach(function(el) {
        if (z >= 2.5) el.classList.add('zoom-visible');
        else el.classList.remove('zoom-visible');
      });
    }

    map.on('zoomend', updateLabelsVisibility);
    updateLabelsVisibility();

    // ============================================================
    // 13. ПОДПИСЬ ЗАЛИПАЕТ ПРИ КЛИКЕ НА ИКОНКУ
    // ============================================================
    document.addEventListener('click', function(e) {
      document.querySelectorAll('.marker-wrap.pinned').forEach(function(el) {
        el.classList.remove('pinned');
      });
      var wrap = e.target.closest('.marker-wrap');
      if (wrap) wrap.classList.add('pinned');
    });

    // ============================================================
    // 14. КЛИК ПО КАРТЕ → координаты в консоль (F12)
    // ============================================================
    map.on('click', function(e) {
      var x = Math.round(e.latlng.lng);
      var y = Math.round(H - e.latlng.y);
      console.log('Координаты: x = ' + x + ', y = ' + y);
    });
  </script>
</body>
</html>
